<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CTA Live Trains</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <style>
    :root {
      color-scheme: light;
      --panel-bg: #f8f9fa;
      --panel-border: #dcdfe3;
      --text-muted: #6c757d;
      --shadow: 0 2px 12px rgba(0, 0, 0, 0.12);
    }
    body {
      margin: 0;
      font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
      background: #eef2f7;
    }
    #map {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 0;
    }
    .panel {
      position: absolute;
      top: 16px;
      left: 16px;
      padding: 12px 14px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      box-shadow: var(--shadow);
      max-width: 320px;
      line-height: 1.4;
      z-index: 1000;
    }
    .panel h1 {
      margin: 0 0 6px;
      font-size: 18px;
      letter-spacing: -0.25px;
    }
    .controls {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 8px;
    }
    label {
      font-size: 13px;
      font-weight: 600;
    }
    select {
      width: 100%;
      padding: 6px 8px;
      border-radius: 8px;
      border: 1px solid #cbd0d6;
      background: white;
      font-size: 13px;
    }
    .toggle-group {
      display: flex;
      gap: 6px;
    }
    .toggle-group button {
      flex: 1;
      padding: 6px 8px;
      font-size: 13px;
      border-radius: 8px;
      border: 1px solid #cbd0d6;
      background: white;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, box-shadow 0.15s;
    }
    .toggle-group button.active {
      border-color: #4a90e2;
      box-shadow: 0 0 0 2px rgba(74, 144, 226, 0.15);
      background: #e8f1fc;
    }
    .panel .muted {
      color: var(--text-muted);
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="panel">
    <h1>CTA Live Trains</h1>
    <div class="muted">Updates every 30s. Hover/tap markers for details.</div>
    <div class="controls">
      <div>
        <label for="lineSelect">Lines</label>
        <select id="lineSelect" multiple size="4"></select>
      </div>
      <div id="delayFilter">
        <label>Delay Filter</label>
        <div class="toggle-group" id="delayToggle">
          <button data-filter="all" class="active">All</button>
          <button data-filter="delayed">Delayed</button>
          <button data-filter="on_time">Not delayed</button>
        </div>
      </div>
      <div id="arrivalFilter">
        <label>Arrival Filter</label>
        <div class="toggle-group" id="arrivalToggle">
          <button data-filter="all" class="active">All</button>
          <button data-filter="arriving">Arriving</button>
          <button data-filter="in_transit">In Transit</button>
        </div>
      </div>
    </div>
  </div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script>
    const map = L.map("map").setView([41.8781, -87.6298], 11);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
      maxZoom: 19,
    }).addTo(map);

    const lineColors = {
      red: "#d9534f",
      blue: "#007bff",
      brn: "#8d6e63",
      g: "#2ecc71",
      org: "#e67e22",
      pink: "#e83e8c",
      p: "#6f42c1",
      y: "#f1c40f",
    };

    const markers = new Map();
    const REFRESH_MS = 30_000;
    let lastFeatures = [];
    let delayFilter = "all";
    let arrivalFilter = "all";

    function colorFor(line) {
      const key = (line || "").toLowerCase();
      return lineColors[key] || "#555";
    }

    function formatTime(iso) {
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return "n/a";
      return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
    }

    async function fetchTrains() {
      try {
        const res = await fetch("/api/trains");
        if (!res.ok) throw new Error(`API error ${res.status}`);
        const data = await res.json();
        lastFeatures = data.features || [];
        renderFiltered();
      } catch (err) {
        console.error("Fetch failed", err);
      }
    }

    function parseDelayed(value) {
      if (typeof value === "number") return value === 1;
      const normalized = String(value).trim().toLowerCase();
      if (normalized === "1") return true;
      if (normalized === "0" || normalized === "") return false;
      return normalized === "true" || normalized === "y" || normalized === "yes";
    }

    function parseApproaching(value) {
      if (typeof value === "number") return value === 1;
      const normalized = String(value).trim().toLowerCase();
      if (normalized === "1") return true;
      if (normalized === "0" || normalized === "") return false;
      return normalized === "true" || normalized === "y" || normalized === "yes";
    }

    function getSelectedLines() {
      const select = document.getElementById("lineSelect");
      return new Set(Array.from(select.selectedOptions).map((opt) => opt.value));
    }

    function renderFiltered() {
      const selected = getSelectedLines();
      const filtered = lastFeatures.filter(({ properties }) => {
        const line = (properties.line || "").toLowerCase();
        const matchesLine = selected.size === 0 || selected.has(line);

        const delayed = parseDelayed(properties.is_delayed);
        const approaching = parseApproaching(properties.is_approaching);

        const matchesDelay =
          delayFilter === "all" ||
          (delayFilter === "delayed" && delayed) ||
          (delayFilter === "on_time" && !delayed);

        const matchesArrival =
          arrivalFilter === "all" ||
          (arrivalFilter === "arriving" && approaching) ||
          (arrivalFilter === "in_transit" && !approaching);

        return matchesLine && matchesDelay && matchesArrival;
      });

      renderFeatures(filtered);
    }

    function renderFeatures(features) {
      const seen = new Set();
      features.forEach((feature) => {
        const { properties, geometry } = feature;
        if (!geometry || geometry.type !== "Point") return;
        const [lon, lat] = geometry.coordinates;
        const id = `${properties.route_number || ""}-${properties.line || ""}`;
        seen.add(id);

        const color = colorFor(properties.line);
        const popup = `
          <strong>Line:</strong> ${properties.line || "n/a"}<br/>
          <strong>Train #:</strong> ${properties.route_number || "n/a"}<br/>
          <strong>Destination:</strong> ${properties.dest_name || "n/a"}<br/>
          <strong>Next stop:</strong> ${properties.next_station_name || "n/a"}<br/>
          <strong>Approaching:</strong> ${properties.is_approaching || "n/a"}<br/>
          <strong>Delayed:</strong> ${properties.is_delayed || "n/a"}<br/>
          <strong>ETA:</strong> ${formatTime(properties.expected_arrival_time)}<br/>
          <strong>Last update:</strong> ${formatTime(properties.prediction_generation_time)}
        `;

        if (markers.has(id)) {
          const marker = markers.get(id);
          marker.setLatLng([lat, lon]);
          marker.setStyle({ color, fillColor: color });
          marker.setPopupContent(popup);
        } else {
          const marker = L.circleMarker([lat, lon], {
            radius: 7,
            color,
            fillColor: color,
            fillOpacity: 0.8,
            weight: 2,
          })
            .addTo(map)
            .bindPopup(popup);
          markers.set(id, marker);
        }
      });

      // Remove stale markers
      Array.from(markers.keys()).forEach((id) => {
        if (!seen.has(id)) {
          map.removeLayer(markers.get(id));
          markers.delete(id);
        }
      });
    }

    fetchTrains();
    setInterval(fetchTrains, REFRESH_MS);

    // UI wiring
    const linesList = [
      { value: "red", label: "Red" },
      { value: "blue", label: "Blue" },
      { value: "brn", label: "Brown" },
      { value: "g", label: "Green" },
      { value: "org", label: "Orange" },
      { value: "pink", label: "Pink" },
      { value: "p", label: "Purple" },
      { value: "y", label: "Yellow" },
    ];

    const lineSelect = document.getElementById("lineSelect");
    linesList.forEach(({ value, label }) => {
      const opt = document.createElement("option");
      opt.value = value;
      opt.textContent = label;
      lineSelect.appendChild(opt);
    });
    // Select all by default
    Array.from(lineSelect.options).forEach((opt) => (opt.selected = true));
    lineSelect.addEventListener("change", renderFiltered);

    document.querySelectorAll("#delayToggle button").forEach((btn) => {
      btn.addEventListener("click", () => {
        delayFilter = btn.dataset.filter;
        document.querySelectorAll("#delayToggle button").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        renderFiltered();
      });
    });

    document.querySelectorAll("#arrivalToggle button").forEach((btn) => {
      btn.addEventListener("click", () => {
        arrivalFilter = btn.dataset.filter;
        document.querySelectorAll("#arrivalToggle button").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        renderFiltered();
      });
    });
  </script>
</body>
</html>
